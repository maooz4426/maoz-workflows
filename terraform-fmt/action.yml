name: Terraform fmt
description: 自動でterraform fmtを行います

inputs:
  head_ref:
    required: true
    description: head_refを指定

runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ inputs.head_ref }}

    - uses: hashicorp/setup-terraform@v4

    - name: Terraform auto fmt
      shell: bash
      run: terraform fmt -recursive

    - name: git diff
      id: diff
      shell: bash
      run: git diff --exit-code
      continue-on-error: true

    - name: commit fmt
      if: steps.diff.outcome == 'failure'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "terraform fmt"
        git push origin HEAD:${{ inputs.head_ref }}
